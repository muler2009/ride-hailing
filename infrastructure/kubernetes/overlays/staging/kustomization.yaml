# Staging: a real cluster, real (if lower-traffic) TLS domain, real
# managed Postgres/Redis — everything production has, sized down. This
# overlay assumes staging is its own cluster (or otherwise owns the whole
# `ride-hailing` namespace) rather than sharing one cluster with
# production under a different namespace — see
# infrastructure/kubernetes/README.md if that assumption doesn't hold for
# a given setup; namespace-per-environment needs a namespace override
# added here plus care around kustomize's Namespace-resource-renaming
# behavior, deliberately not taken on in this overlay to keep it simple
# and predictable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/ORG/ride-hailing-backend
    newTag: staging-latest # CI overwrites this per-deploy with the real git SHA tag; see .github/workflows/ci-cd.yml

patches:
  - target:
      kind: ConfigMap
      name: api-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: api-config
      data:
        ALLOWED_HOSTS: staging.ride-hailing.example.com
        CORS_ALLOWED_ORIGINS: https://staging-app.ride-hailing.example.com
        DATABASE_HOST: ride-hailing-staging.CHANGEME.rds.amazonaws.com
        REDIS_URL: redis://ride-hailing-staging.CHANGEME.cache.amazonaws.com:6379/0
        CELERY_BROKER_URL: redis://ride-hailing-staging.CHANGEME.cache.amazonaws.com:6379/0
        CELERY_RESULT_BACKEND: redis://ride-hailing-staging.CHANGEME.cache.amazonaws.com:6379/0
        LOG_LEVEL: DEBUG # more verbose than production, still structured JSON
        CHAPA_CALLBACK_URL: https://staging.ride-hailing.example.com/api/v1/payments/webhooks/chapa/
        KEYCLOAK_SERVER_URL: https://auth-staging.ride-hailing.example.com

  - target:
      kind: Ingress
      name: ride-hailing
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ride-hailing
        annotations:
          # Let's Encrypt's staging issuer — avoids burning the (rate-
          # limited) production issuer's quota on a domain that reissues
          # far more often during iteration than a real prod domain does.
          cert-manager.io/cluster-issuer: letsencrypt-staging
      spec:
        tls:
          - hosts: ["staging.ride-hailing.example.com"]
            secretName: ride-hailing-tls
        rules:
          - host: staging.ride-hailing.example.com

  # Modest, fixed-ish capacity — staging doesn't see production traffic
  # patterns, so there's little for the HPA to react to; sized for "a
  # couple of engineers/QA poking at it", not for load.
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests: { cpu: 150m, memory: 192Mi }
                  limits: { cpu: 500m, memory: 384Mi }
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api
      spec:
        minReplicas: 2
        maxReplicas: 4

  - target:
      kind: Deployment
      name: websocket
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: websocket
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: websocket
                resources:
                  requests: { cpu: 100m, memory: 192Mi }
                  limits: { cpu: 400m, memory: 384Mi }
  - target:
      kind: HorizontalPodAutoscaler
      name: websocket
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: websocket
      spec:
        minReplicas: 2
        maxReplicas: 3

  - target:
      kind: Deployment
      name: worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: worker
                args: ["-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
                resources:
                  requests: { cpu: 150m, memory: 192Mi }
                  limits: { cpu: 500m, memory: 384Mi }
  - target:
      kind: HorizontalPodAutoscaler
      name: worker
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: worker
      spec:
        minReplicas: 1
        maxReplicas: 3
