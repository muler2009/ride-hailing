# TEMPLATE — not a real Secret to `kubectl apply -f` as-is.
#
# This file exists to document exactly which keys the application needs,
# so nothing gets discovered missing at 3am. It is deliberately NOT listed
# in kustomization.yaml's resources — applying literal placeholder
# credentials to a real cluster would be worse than not shipping this file
# at all.
#
# The values below belong in whatever secret store the target cluster
# actually uses instead — e.g. one of:
#   - Sealed Secrets (bitnami-labs/sealed-secrets): encrypt this file's
#     values with `kubeseal`, commit the resulting SealedSecret (safe to
#     commit; only the cluster's controller can decrypt it), let it
#     materialize this Secret automatically.
#   - External Secrets Operator, syncing from AWS Secrets Manager / GCP
#     Secret Manager / Vault into a Secret with this same name and keys.
#   - A CI/CD step that creates/updates the Secret imperatively from
#     values held in the CI provider's own encrypted secret store
#     (`kubectl create secret generic api-secrets --from-literal=... --dry-run=client -o yaml | kubectl apply -f -`).
# Any of these produce a real `Secret` object named `api-secrets` with the
# keys below; the Deployments (envFrom: secretRef: name: api-secrets)
# don't care which approach produced it.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: ride-hailing
type: Opaque
stringData:
  # Django's cryptographic signing key — session/CSRF tokens, password
  # reset tokens, etc. Generate one per environment; never reuse the
  # dev-only default baked into config/settings.py.
  SECRET_KEY: "CHANGEME-generate-a-real-random-value-per-environment"

  DATABASE_PASSWORD: "CHANGEME"

  # Only needed here if the managed Redis requires AUTH; see the note in
  # configmap.yaml. Leave unset (and let REDIS_URL live in the ConfigMap,
  # with no credentials embedded) if it doesn't.
  # REDIS_URL: "redis://:CHANGEME@CHANGEME.invalid:6379/0"

  KEYCLOAK_CLIENT_SECRET: "CHANGEME"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGEME"

  GOOGLE_MAPS_API_KEY: "CHANGEME"

  STRIPE_SECRET_KEY: "CHANGEME"
  STRIPE_WEBHOOK_SECRET: "CHANGEME"
  CHAPA_SECRET_KEY: "CHANGEME"
  CHAPA_WEBHOOK_SECRET: "CHANGEME"

  TWILIO_ACCOUNT_SID: "CHANGEME"
  TWILIO_AUTH_TOKEN: "CHANGEME"

  FCM_ACCESS_TOKEN: "CHANGEME"
