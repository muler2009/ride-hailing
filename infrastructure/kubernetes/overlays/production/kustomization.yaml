# Production: base's own defaults are already sized for a real (if
# modest) production footprint, so this overlay mostly overrides
# environment identity (hostnames, managed-service endpoints) rather than
# capacity — capacity headroom comes from raising the HPAs' maxReplicas
# above base's conservative defaults, not from hand-picking a "production"
# replica count that would just be stale the day traffic changes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/ORG/ride-hailing-backend
    newTag: production-latest # CI overwrites this per-deploy with the real, immutable git SHA tag; see .github/workflows/ci-cd.yml — production should never float on a mutable tag like this placeholder implies

patches:
  - target:
      kind: ConfigMap
      name: api-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: api-config
      data:
        ALLOWED_HOSTS: ride-hailing.example.com
        CORS_ALLOWED_ORIGINS: https://app.ride-hailing.example.com
        DATABASE_HOST: ride-hailing-production.CHANGEME.rds.amazonaws.com
        REDIS_URL: redis://ride-hailing-production.CHANGEME.cache.amazonaws.com:6379/0
        CELERY_BROKER_URL: redis://ride-hailing-production.CHANGEME.cache.amazonaws.com:6379/0
        CELERY_RESULT_BACKEND: redis://ride-hailing-production.CHANGEME.cache.amazonaws.com:6379/0
        CHAPA_CALLBACK_URL: https://ride-hailing.example.com/api/v1/payments/webhooks/chapa/
        KEYCLOAK_SERVER_URL: https://auth.ride-hailing.example.com
        # Ramped up from base's conservative 1-day default once HSTS has
        # run safely in production for a while — see the reasoning in
        # config/settings.py. Not jumped to a multi-year value+preload on
        # day one.
        SECURE_HSTS_SECONDS: "2592000" # 30 days
        SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"

  - target:
      kind: Ingress
      name: ride-hailing
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ride-hailing
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
      spec:
        tls:
          - hosts: ["ride-hailing.example.com"]
            secretName: ride-hailing-tls
        rules:
          - host: ride-hailing.example.com

  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api
      spec:
        minReplicas: 3
        maxReplicas: 20
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: api
      spec:
        minAvailable: 66%

  - target:
      kind: HorizontalPodAutoscaler
      name: websocket
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: websocket
      spec:
        minReplicas: 3
        maxReplicas: 15

  - target:
      kind: HorizontalPodAutoscaler
      name: worker
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: worker
      spec:
        minReplicas: 3
        maxReplicas: 15
