# One shared ServiceAccount for every process (api, websocket, worker,
# beat) — none of them talk to the Kubernetes API themselves, so there is
# no RBAC Role bound to it; it exists only so pods aren't running as the
# namespace's "default" ServiceAccount, keeping the door closed on that
# ServiceAccount ever accidentally being granted something later and every
# pod in the namespace inheriting it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ride-hailing-app
  namespace: ride-hailing
